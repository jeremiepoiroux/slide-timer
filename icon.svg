<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1a1a1a"/>
  <!-- Outer ring -->
  <circle cx="256" cy="272" r="168" fill="none" stroke="#2e2e2e" stroke-width="18"/>
  <!-- Progress arc (~75%) -->
  <circle cx="256" cy="272" r="168" fill="none" stroke="#3b82f6" stroke-width="18"
          stroke-dasharray="792 264" stroke-dashoffset="198" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="256" y1="272" x2="256" y2="136" stroke="#f0f0f0" stroke-width="14" stroke-linecap="round"/>
  <!-- Second hand -->
  <line x1="256" y1="272" x2="340" y2="316" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="272" r="12" fill="#f0f0f0"/>
  <!-- Crown / stem -->
  <rect x="232" y="88" width="48" height="20" rx="10" fill="#888"/>
  <rect x="218" y="76" width="76" height="18" rx="9" fill="#888"/>
</svg>
